services:
  - type: web
    name: pilots-hq
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pilots-db
          property: connectionString
      - key: PORT
        value: 3000

databases:
  - name: pilots-db
    plan: free
    ipAllowList: []
