apiVersion: v1
kind: Service
metadata:
  name: pilots-api
  labels:
    app: pilots
    component: api
spec:
  type: LoadBalancer
  sessionAffinity: None
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: pilots
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: pilots-api-internal
  labels:
    app: pilots
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 3001
    targetPort: http
    protocol: TCP
  selector:
    app: pilots
    component: api
