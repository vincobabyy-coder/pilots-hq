apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilots-api
  labels:
    app: pilots
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pilots
      component: api
  template:
    metadata:
      labels:
        app: pilots
        component: api
    spec:
      serviceAccountName: pilots-api
      containers:
      - name: api
        image: pilots:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        env:
        - name: NODE_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: jwt-secret
        - name: ENCRYPTION_KEY_PRIMARY
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: encryption-key-primary
        - name: SHOPIFY_API_KEY
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: shopify-api-key
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: stripe-secret-key
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: twilio-auth-token
        - name: PAGERDUTY_API_KEY
          valueFrom:
            secretKeyRef:
              name: pilots-secrets
              key: pagerduty-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pilots
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pilots-api
  labels:
    app: pilots
    component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pilots-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pilots
      component: api
